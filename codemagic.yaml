workflows:
  ios-testflight:
    name: Wobbots iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      node: 20
      xcode: 26.6
      cocoapods: default
      vars:
        BUNDLE_ID: com.wobbots.game
        APP_VERSION: 1.0.0
    scripts:
      - name: Proje hazirla
        script: |
          mkdir -p www && cp index.html www/index.html
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Ikon, acilis ekrani, ayarlar
        script: |
          A=ios/App/App/Assets.xcassets
          I=$(ls icon.* | head -1); S=$(ls splash.* | head -1)
          sips -s format png -z 1024 1024 "$I" --out $A/AppIcon.appiconset/AppIcon-512@2x.png
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do sips -s format png -z 2732 2732 "$S" --out $A/Splash.imageset/$f; done
          P=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Delete :$1" $P 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" $P; }
          pb CFBundleDisplayName string Wobbots
          pb ITSAppUsesNonExemptEncryption bool false
          pb UIRequiresFullScreen bool true
          pb UIStatusBarHidden bool true
          pb UIViewControllerBasedStatusBarAppearance bool false
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P 2>/dev/null || true
          pb UISupportedInterfaceOrientations array
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          X=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' $X
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" $X
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $APP_VERSION;/g" $X
      - name: Imzalama
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Derleme
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
